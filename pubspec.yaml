name: hit_app
description: "Event discovery and ticketing for Heavy Industries Taxila."
# Private app - never published to pub.dev.
publish_to: "none"

# <build-name>+<build-number>. On Android these map to versionName and
# versionCode; on iOS to CFBundleShortVersionString and CFBundleVersion.
version: 1.1.0+2

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Backend: Postgres, auth, storage and realtime.
  supabase_flutter: ^2.17.1

  # State
  provider: ^6.1.5

  # Presentation
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  intl: ^0.20.3

  # Device capabilities
  image_picker: ^1.2.3
  mobile_scanner: ^7.4.0
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
